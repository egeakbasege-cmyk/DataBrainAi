<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0A0F1E"/>

  <!-- Outer gold ring glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#goldRing)" stroke-width="1"/>

  <!-- Main mast -->
  <line x1="32" y1="8" x2="32" y2="50" stroke="#C9A96E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Main sail (large, gold fill) -->
  <path d="M32 10 L52 44 L32 48 Z"
    fill="url(#mainSail)" stroke="#C9A96E" stroke-width="1" stroke-linejoin="round"/>

  <!-- Fore sail (smaller, starboard) -->
  <path d="M32 14 L18 42 L32 46 Z"
    fill="url(#foreSail)" stroke="#C9A96E" stroke-width="0.75" opacity="0.7" stroke-linejoin="round"/>

  <!-- Boom (horizontal spar) -->
  <line x1="19" y1="48" x2="52" y2="48" stroke="#C9A96E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Hull -->
  <path d="M16 50 Q32 56 48 50 L46 52 Q32 58 18 52 Z"
    fill="url(#hullGrad)"/>

  <!-- Gold star / crest mark at masthead -->
  <circle cx="32" cy="8" r="2.5" fill="#C9A96E" opacity="0.9"/>

  <!-- Water line reflection (subtle) -->
  <path d="M20 53 Q32 56 44 53" stroke="#C9A96E" stroke-width="0.6" opacity="0.25" stroke-linecap="round"/>

  <defs>
    <linearGradient id="mainSail" x1="32" y1="10" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B6A35" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="foreSail" x1="32" y1="14" x2="18" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B6A35" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="16" y1="50" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
</svg>
