<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#0A2840"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6B4E1E" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="mg" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="220" rx="220" ry="180" fill="url(#mg)"/>

  <!-- Moon -->
  <circle cx="400" cy="160" r="38" fill="#C9A96E" opacity="0.8" filter="url(#glow)"/>
  <circle cx="416" cy="150" r="30" fill="#0D1A33"/>

  <!-- Stars -->
  <circle cx="100" cy="80" r="1.5" fill="#C9A96E" opacity="0.7"/>
  <circle cx="650" cy="60" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="700" cy="180" r="1" fill="#C9A96E" opacity="0.5"/>
  <circle cx="80" cy="220" r="1" fill="white" opacity="0.5"/>
  <circle cx="720" cy="280" r="1.5" fill="white" opacity="0.4"/>

  <!-- Water -->
  <rect x="0" y="520" width="800" height="280" fill="#030D1A"/>
  <path d="M0 535 Q400 525 800 538" stroke="#C9A96E" stroke-width="0.5" opacity="0.15"/>
  <path d="M0 560 Q400 550 800 563" stroke="white" stroke-width="0.3" opacity="0.08"/>

  <!-- Hull -->
  <path d="M220 525 Q400 548 580 525 L560 538 Q400 560 240 538 Z" fill="#8B6A35" opacity="0.9"/>

  <!-- Mast -->
  <line x1="400" y1="165" x2="400" y2="530" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>

  <!-- Main sail -->
  <path d="M400 178 L580 490 L400 520 Z" fill="url(#s1)" stroke="#C9A96E" stroke-width="1.5"/>

  <!-- Fore sail -->
  <path d="M400 195 L240 475 L400 505 Z" fill="#C9A96E" fill-opacity="0.18" stroke="#C9A96E" stroke-width="0.8" opacity="0.7"/>

  <!-- Boom -->
  <line x1="235" y1="524" x2="565" y2="524" stroke="#C9A96E" stroke-width="2" stroke-linecap="round"/>

  <!-- Moon reflection -->
  <ellipse cx="400" cy="640" rx="40" ry="80" fill="#C9A96E" opacity="0.05"/>
</svg>
