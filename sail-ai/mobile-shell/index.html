<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sail AI</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));
      background: #FAFAF8;
      color: #0C0C0E;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 22rem; }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 0.75rem;
      color: #8A6D3B;
    }
    p { font-size: 0.86rem; line-height: 1.65; color: rgba(12,12,14,0.6); margin: 0 0 1.5rem; }
    button {
      width: 100%;
      padding: 0.9rem 1rem;
      min-height: 48px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #B8882A, #C9A96E);
      color: #0C0C0E;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 1.5rem;
      border: 2px solid rgba(138,109,59,0.25);
      border-top-color: #8A6D3B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <!--
    Offline fallback shell.

    Capacitor requires a local `webDir`, but the app itself is served from the
    remote Next.js deployment (see capacitor.config.ts). This page is only ever
    rendered when the device cannot reach that server, so it must stay
    dependency-free and self-contained.
  -->
  <div class="wrap">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Sail AI</h1>
    <p id="msg">Connecting…</p>
    <button id="retry" type="button" hidden>Retry</button>
  </div>

  <script>
    (function () {
      var msg   = document.getElementById('msg');
      var retry = document.getElementById('retry');

      function showOffline() {
        document.querySelector('.spinner').style.display = 'none';
        msg.textContent = 'No internet connection. Sail AI needs to be online to run your analyses.';
        retry.hidden = false;
      }

      retry.addEventListener('click', function () { location.reload(); });
      window.addEventListener('online', function () { location.reload(); });

      if (!navigator.onLine) showOffline();
      else setTimeout(function () { if (!navigator.onLine) showOffline(); }, 6000);
    })();
  </script>
</body>
</html>
